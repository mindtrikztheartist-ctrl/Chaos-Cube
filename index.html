<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Cube</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="game">

        <h1>CHAOS CUBE</h1>

        <section id="world">
            <div id="player">🧙</div>
        </section>

        <section id="status">
            <p>HP: <span id="hp">100</span> / 100</p>
            <p>MP: <span id="mp">50</span> / 50</p>
        </section>

        <section id="message">
            Your adventure begins...
        </section>

        <section id="actions">
            <button onclick="attack()">ATTACK</button>
            <button onclick="magic()">MAGIC</button>
            <button onclick="defend()">DEFEND</button>
            <button onclick="useItem()">ITEM</button>
        </section>

    </main>

    <script src="game.js"></script>

</body>
</html>
